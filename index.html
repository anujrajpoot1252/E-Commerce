<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopEase - Inventory and Orders</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div>
      <h1>ShopEase</h1>
      <small>Inventory, Cart and Order Management</small>
    </div>
    <div class="badge">Operational</div>
  </header>

  <div class="grid">
    <!-- Products & Cart Column -->
    <div>
      <div class="card">
        <h2>Available Products</h2>
        <div class="product-list" id="productsContainer"></div>
      </div>

      <div class="card">
        <h2>Cart</h2>
        <div id="cartItemsContainer"><p style="color: #64748b; font-size: 13px;">Cart is empty.</p></div>
        <div class="cart-total">
          <span>Total</span>
          <span id="cartTotal">₹0</span>
        </div>
        <button class="btn-success" onclick="checkoutOrder()">Place Order</button>
      </div>
    </div>

    <!-- Orders & Activity Log Column -->
    <div>
      <div class="card">
        <h2>Order History</h2>
        <div id="ordersContainer"><p style="color: #64748b; font-size: 13px;">No orders placed yet.</p></div>
      </div>

      <div class="card">
        <h2>Activity Log</h2>
        <div class="log-box" id="logBox"></div>
      </div>
    </div>
  </div>

  <script>
    const products = [
      { id: 'p1', name: 'Wireless Headphones', price: 1999, stock: 5 },
      { id: 'p2', name: 'Smart Fitness Watch', price: 2999, stock: 3 },
      { id: 'p3', name: 'Casual Cotton T-Shirt', price: 499, stock: 10 },
      { id: 'p4', name: 'RGB Gaming Mouse', price: 899, stock: 2 }
    ];

    let cart = [];
    let orders = [];

    function log(msg) {
      const box = document.getElementById('logBox');
      const time = new Date().toLocaleTimeString('en-US', { hour12: false });
      box.innerHTML += `<div>[${time}] ${msg}</div>`;
      box.scrollTop = box.scrollHeight;
    }

    function renderProducts() {
      const container = document.getElementById('productsContainer');
      container.innerHTML = products.map(p => `
        <div class="product-card">
          <div>
            <div class="product-name">${p.name}</div>
            <div class="product-price">₹${p.price.toLocaleString('en-IN')}</div>
            <div class="product-stock">In stock: <span class="stock-badge">${p.stock}</span></div>
          </div>
          <button onclick="addToCart('${p.id}')" ${p.stock <= 0 ? 'disabled' : ''}>
            ${p.stock <= 0 ? 'Out of stock' : 'Add to cart'}
          </button>
        </div>
      `).join('');
    }

    function renderCart() {
      const container = document.getElementById('cartItemsContainer');
      const totalSpan = document.getElementById('cartTotal');

      if (cart.length === 0) {
        container.innerHTML = '<p style="color: #64748b; font-size: 13px;">Cart is empty.</p>';
        totalSpan.innerText = '₹0';
        return;
      }

      let total = 0;
      container.innerHTML = cart.map((item, idx) => {
        const subtotal = item.price * item.quantity;
        total += subtotal;
        return `
          <div class="cart-item">
            <div>
              <strong>${item.name}</strong><br>
              <small>₹${item.price.toLocaleString('en-IN')} × ${item.quantity} = ₹${subtotal.toLocaleString('en-IN')}</small>
            </div>
            <div>
              <button class="btn-danger" onclick="removeFromCart(${idx})">Remove</button>
            </div>
          </div>
        `;
      }).join('');

      totalSpan.innerText = '₹' + total.toLocaleString('en-IN');
    }

    function renderOrders() {
      const container = document.getElementById('ordersContainer');
      if (orders.length === 0) {
        container.innerHTML = '<p style="color: #64748b; font-size: 13px;">No orders placed yet.</p>';
        return;
      }

      container.innerHTML = orders.map(o => `
        <div class="order-card">
          <div class="order-header">
            <span>${o.orderId}</span>
            <span class="${o.status === 'Cancelled' ? 'order-status-cancelled' : 'order-status-placed'}">${o.status}</span>
          </div>
          <div>Total: ₹${o.totalAmount.toLocaleString('en-IN')} (${o.items.length} ${o.items.length === 1 ? 'item' : 'items'})</div>
          <small style="color: #64748b;">Created at: ${o.createdAt}</small>
          ${o.status === 'Placed' ? `
            <div style="margin-top: 8px;">
              <button class="btn-danger" style="font-size: 12px; padding: 4px 8px;" onclick="cancelOrder('${o.orderId}')">
                Cancel order
              </button>
            </div>
          ` : ''}
        </div>
      `).join('');
    }

    function addToCart(productId) {
      const product = products.find(p => p.id === productId);
      if (!product) return;

      const existing = cart.find(item => item.productId === productId);
      const currentInCart = existing ? existing.quantity : 0;

      if (currentInCart + 1 > product.stock) {
        log(`Stock limit reached for ${product.name} (available: ${product.stock}).`);
        return;
      }

      if (existing) {
        existing.quantity += 1;
      } else {
        cart.push({
          productId: product.id,
          name: product.name,
          price: product.price,
          quantity: 1
        });
      }

      log(`Added "${product.name}" to cart.`);
      renderCart();
    }

    function removeFromCart(index) {
      const removed = cart.splice(index, 1)[0];
      log(`Removed "${removed.name}" from cart.`);
      renderCart();
    }

    function checkoutOrder() {
      if (cart.length === 0) {
        log('Checkout attempted with an empty cart.');
        return;
      }

      for (const item of cart) {
        const product = products.find(p => p.id === item.productId);
        if (!product || product.stock < item.quantity) {
          log(`Insufficient stock to complete checkout for ${item.name}.`);
          return;
        }
      }

      const total = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);
      const orderId = 'ORD-' + Math.floor(1000 + Math.random() * 9000);

      const order = {
        orderId,
        items: JSON.parse(JSON.stringify(cart)),
        totalAmount: total,
        status: 'Placed',
        createdAt: new Date().toLocaleTimeString('en-US', { hour12: false })
      };

      for (const item of cart) {
        const product = products.find(p => p.id === item.productId);
        product.stock -= item.quantity;
      }

      orders.unshift(order);
      cart = [];

      log(`Order ${orderId} created for ₹${total.toLocaleString('en-IN')}. Stock updated.`);
      renderProducts();
      renderCart();
      renderOrders();
    }

    function cancelOrder(orderId) {
      const order = orders.find(o => o.orderId === orderId);
      if (!order || order.status === 'Cancelled') return;

      order.status = 'Cancelled';

      for (const item of order.items) {
        const product = products.find(p => p.id === item.productId);
        if (product) {
          product.stock += item.quantity;
        }
      }

      log(`Order ${orderId} cancelled. Stock restored to inventory.`);
      renderProducts();
      renderOrders();
    }

    renderProducts();
    renderCart();
    renderOrders();
    log('ShopEase inventory and orders engine initialized.');
  </script>
</body>
</html>
